name: Check reference links

# Reference rot is the main way this project degrades, so links are checked on a
# schedule rather than on every push. A failure means a definite 404/410;
# bot-blocked and rate-limited hosts are reported but do not fail the run.
on:
  schedule:
    - cron: '17 6 1 * *'   # 06:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Probe every reference URL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check links
        run: node scripts/check-links.mjs
