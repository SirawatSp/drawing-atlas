name: Fetch books & build glossary

# Books are downloaded rather than committed by hand, because Project Gutenberg
# does not serve CORS headers and a browser cannot fetch them directly.
# The glossary is built against the same translation service the reader uses,
# in batches, because the free tier is rate limited.
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Refetch books that are already present'
        type: boolean
        default: false
      glossary_limit:
        description: 'Max new words to translate this run'
        type: string
        default: '4000'
  schedule:
    - cron: '23 4 * * 0'   # Sundays — grows the glossary a batch at a time

permissions:
  contents: write
  actions: write   # to dispatch the Pages deploy — see "Publish the new library"

concurrency:
  group: books
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch and translate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch books from Project Gutenberg
        run: node scripts/fetch-books.mjs ${{ inputs.force && '--force' || '' }}

      - name: Build Thai glossary
        id: glossary
        # Never fail the run on a rate limit — the script stops cleanly and the
        # next scheduled run continues where it left off.
        continue-on-error: true
        run: node scripts/build-glossary.mjs --limit ${{ inputs.glossary_limit || '4000' }}

      # continue-on-error reports the step as successful even when the command
      # exits non-zero, which once hid a real crash behind a green tick. Surface
      # it: a rate limit is expected and harmless, a crash is not.
      - name: Flag a masked glossary failure
        if: steps.glossary.outcome == 'failure'
        run: |
          echo "::warning title=Glossary step failed::scripts/build-glossary.mjs exited non-zero. Rate limits are expected; a crash is not. Check its log above."

      - name: Validate data still passes
        run: node scripts/check-data.mjs

      - name: Commit any changes
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/books; then
            echo "No changes to the library."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BOOKS=$(ls data/books/*.json 2>/dev/null | grep -v -e index.json -e glossary-th.json | wc -l | tr -d ' ')
          WORDS=$(node -e "try{console.log(Object.keys(require('./data/books/glossary-th.json').words).length)}catch(e){console.log(0)}")
          git add data/books
          git commit -m "Update reading library: ${BOOKS} book(s), ${WORDS} glossary words

          Generated by scripts/fetch-books.mjs and scripts/build-glossary.mjs.
          Texts are public domain, from Project Gutenberg."
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN deliberately does not trigger other
      # workflows, so the commit above will never set off the `on: push` deploy
      # in pages.yml. Without this step the books land in the repository and the
      # published site keeps serving the commit before them — which is exactly
      # what happened: 34 books committed, and a live site still showing an
      # empty library.
      - name: Publish the new library
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
